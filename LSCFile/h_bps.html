    <style>
    :root{
      --ink:#1f3551; --ink-soft:#3f4a5a; --muted:#7c8898;
      --red:#ec1b23; --red-deep:#c41019; --link:#0b6bd3;
      --bg:#ffffff; --soft:#f5f6f9; --card:#ffffff; --line:#e4e7ec;
      --shadow:0 1px 2px rgba(31,53,81,.05),0 14px 34px -20px rgba(31,53,81,.35);
      --maxw:900px;
    }
    .pg{font-family:"Open Sans",system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink)}
    .pg *{box-sizing:border-box}
    .pg a{color:var(--link);text-decoration:none}
    .pg a:hover{color:var(--red-deep)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

    .pg .hero{background:linear-gradient(180deg,#ffffff 0%,var(--soft) 100%);border-bottom:1px solid var(--line);
      padding:30px 16px 26px;text-align:center}
    .pg .hero .wrap{max-width:var(--maxw);margin:0 auto;animation:fadeUp .7s ease both}
    .pg .hero .eyebrow{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--red)}
    .pg .hero h1{margin:8px 0 0;font-weight:800;color:var(--ink);font-size:clamp(24px,3.4vw,34px)}

    .pg .article{max-width:440px;margin:0 auto;padding:36px 18px 20px;animation:fadeUp .8s ease both .05s;text-align:center}
    .pg .lockicon{width:64px;height:64px;border-radius:50%;background:#fde7e8;color:var(--red);display:flex;align-items:center;
      justify-content:center;font-size:26px;margin:0 auto 14px}
    .pg .article p.note{color:var(--ink-soft);font-size:15px;margin:0 0 22px}
    .pg .loginbox{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px 22px;text-align:left}
    .pg .loginbox label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin:12px 0 6px}
    .pg .loginbox input[type=text],.pg .loginbox input[type=password]{width:100%;padding:11px 13px;border:1px solid var(--line);
      border-radius:10px;font-size:14px;background:var(--soft)}
    .pg .loginbox input:focus{outline:none;border-color:var(--red);background:#fff}
    .pg .loginbox .submit{width:100%;margin-top:18px;background:var(--red);color:#fff;border:none;border-radius:999px;
      padding:12px;font-weight:700;font-size:14px;cursor:pointer;transition:background .18s ease}
    .pg .loginbox .submit:hover{background:var(--red-deep)}
    .pg .loginbox .opts{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12.5px;color:var(--muted)}
    .pg .backhome{display:inline-block;margin-top:18px;font-size:13px;font-weight:700;color:var(--ink-soft)}
    .pg .backhome:hover{color:var(--red)}

    .pg .site-footer{margin-top:24px;background:linear-gradient(135deg,#1f3551,#142a44);color:#fff}
    .pg .site-footer .inner{max-width:1120px;margin:0 auto;padding:32px 18px;text-align:center}
    .pg .site-footer .social{display:flex;gap:16px;justify-content:center;font-size:20px;margin-top:10px}
    .pg .site-footer a{color:rgba(255,255,255,.82)}
    .pg .site-footer a:hover{color:#fff}
    .pg .site-footer .copy{border-top:1px solid rgba(255,255,255,.14);text-align:center;padding:14px;font-size:13px;color:rgba(255,255,255,.7)}
    </style>
</head>

<body>
